<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>До розыгрыша</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a12;
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* Живой фон */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: float 14s ease-in-out infinite;
  }
  .blob1 { width: 420px; height: 420px; background: #7b2ff7; top: -120px; left: -100px; }
  .blob2 { width: 380px; height: 380px; background: #ff2f8e; bottom: -140px; right: -100px; animation-delay: -5s; }
  .blob3 { width: 300px; height: 300px; background: #00c2ff; top: 50%; left: 60%; animation-delay: -9s; opacity: 0.35; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(60px, -40px) scale(1.15); }
    66%      { transform: translate(-50px, 50px) scale(0.9); }
  }

  /* Стеклянная карточка */
  .card {
    position: relative;
    z-index: 2;
    padding: 50px 60px 55px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
    animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Заголовок */
  h1 {
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: lowercase;
    color: #fff;
    margin-bottom: 38px;
    text-shadow: 0 0 30px rgba(180, 120, 255, 0.8);
  }

  h1 span {
    background: linear-gradient(90deg, #b06bff, #ff5fa2, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Сетка отсчёта */
  .countdown {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 100px;
  }

  .num {
    position: relative;
    width: 100px;
    padding: 16px 0;
    border-radius: 18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15),
                0 8px 25px rgba(0, 0, 0, 0.4);
    font-size: 44px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 22px rgba(150, 100, 255, 0.9);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .num.tick {
    animation: tick 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes tick {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 45px rgba(170, 110, 255, 0.8); }
    100% { transform: scale(1); }
  }

  .label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 600;
  }

  /* Разделитель-двоеточие */
  .sep {
    font-size: 40px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.25);
    align-self: flex-start;
    padding-top: 22px;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.7; }
  }

  /* Текст под таймером */
  .hint {
    margin-top: 32px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 1px;
  }

  @media (max-width: 560px) {
    .card { padding: 35px 25px 40px; border-radius: 22px; }
    .unit { min-width: 68px; }
    .num { width: 68px; font-size: 30px; padding: 12px 0; border-radius: 14px; }
    .sep { font-size: 28px; padding-top: 16px; }
    .countdown { gap: 8px; }
    .label { font-size: 10px; letter-spacing: 1px; }
    h1 { margin-bottom: 25px; }
  }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="card">
    <h1>до <span>розыгрыша:</span></h1>

    <div class="countdown">
      <div class="unit">
        <div class="num" id="days">00</div>
        <div class="label" id="days-label">дней</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="num" id="hours">00</div>
        <div class="label" id="hours-label">часов</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="num" id="minutes">00</div>
        <div class="label" id="minutes-label">минут</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="num" id="seconds">00</div>
        <div class="label" id="seconds-label">секунд</div>
      </div>
    </div>

    <div class="hint">понедельник, 23:59</div>
  </div>

<script>
  // Формы слов для правильного склонения
  const FORMS = {
    days:    ['день', 'дня', 'дней'],
    hours:   ['час', 'часа', 'часов'],
    minutes: ['минута', 'минуты', 'минут'],
    seconds: ['секунда', 'секунды', 'секунд']
  };

  function plural(n, forms) {
    const n10 = n % 10;
    const n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return forms[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
    return forms[2];
  }

  // Ближайший понедельник 23:59
  function getTarget() {
    const now = new Date();
    const target = new Date(now);
    const day = now.getDay();               // 0 = вс, 1 = пн
    const daysUntilMonday = (1 - day + 7) % 7;

    target.setDate(now.getDate() + daysUntilMonday);
    target.setHours(23, 59, 0, 0);

    // Если время уже прошло — берём следующий понедельник
    if (target <= now) {
      target.setDate(target.getDate() + 7);
    }
    return target;
  }

  let target = getTarget();

  const els = {
    days:    document.getElementById('days'),
    hours:   document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
    daysLabel:    document.getElementById('days-label'),
    hoursLabel:   document.getElementById('hours-label'),
    minutesLabel: document.getElementById('minutes-label'),
    secondsLabel: document.getElementById('seconds-label')
  };

  const prev = { days: null, hours: null, minutes: null, seconds: null };

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function setValue(key, value) {
    const el = els[key];
    const labelEl = els[key + 'Label'];
    const text = pad(value);

    if (el.textContent !== text) {
      el.textContent = text;
      el.classList.remove('tick');
      void el.offsetWidth; // перезапуск анимации
      el.classList.add('tick');
    }
    if (prev[key] !== value) {
      labelEl.textContent = plural(value, FORMS[key]);
      prev[key] = value;
    }
  }

  function update() {
    const now = new Date();

    if (now >= target) {
      target = getTarget(); // на случай, если вкладка была открыта долго
    }

    let diff = Math.floor((target - now) / 1000);
    if (diff < 0) diff = 0;

    const days    = Math.floor(diff / 86400);
    const hours   = Math.floor((diff % 86400) / 3600);
    const minutes = Math.floor((diff % 3600) / 60);
    const seconds = diff % 60;

    setValue('days', days);
    setValue('hours', hours);
    setValue('minutes', minutes);
    setValue('seconds', seconds);
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
